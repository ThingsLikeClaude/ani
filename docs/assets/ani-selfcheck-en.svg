<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" role="img" aria-label="install self-check: doctor shows zero FAILs, make one correction, check the F file appeared, heartbeat in the next session" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#44566b"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2fd6c3"/></marker>
  </defs>
  <rect x="1.5" y="1.5" width="877" height="473" rx="14" fill="#0e1520" stroke="#1e2a38" stroke-width="1.5"/>
  <text x="28" y="42" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" letter-spacing="3" fill="#48626f">ANI &#183; INSTALL SELF-CHECK</text>
  <text x="852" y="42" text-anchor="end" font-size="11" fill="#5d7284">three minutes after install</text>

  <!-- step 1 -->
  <g>
    <rect x="40" y="66" width="430" height="76" rx="10" fill="#151f2b" stroke="#27364a"/>
    <circle cx="66" cy="104" r="13" fill="none" stroke="#2fd6c3" stroke-width="1.5"/>
    <text x="66" y="108.5" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#2fd6c3">1</text>
    <text x="92" y="99" font-size="13.5" font-weight="600" fill="#e7eef6"><tspan font-family="Consolas,monospace" fill="#7fd8cc">/ani doctor</tspan> — zero FAILs</text>
    <text x="92" y="121" font-size="11" fill="#94a5b8">two WARNs (no store yet) are normal — no heart to beat yet</text>
  </g>
  <line x1="255" y1="142" x2="255" y2="164" stroke="#44566b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- step 2 -->
  <g>
    <rect x="40" y="168" width="430" height="76" rx="10" fill="#151f2b" stroke="#27364a"/>
    <circle cx="66" cy="206" r="13" fill="none" stroke="#2fd6c3" stroke-width="1.5"/>
    <text x="66" y="210.5" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#2fd6c3">2</text>
    <text x="92" y="201" font-size="13.5" font-weight="600" fill="#e7eef6">make one correction in any session</text>
    <text x="92" y="223" font-size="11" fill="#94a5b8">say &#8220;no, that's not it &#8230;&#8221; — any language works</text>
  </g>
  <line x1="255" y1="244" x2="255" y2="268" stroke="#44566b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- decision -->
  <polygon points="255,274 402,331 255,388 108,331" fill="#151f2b" stroke="#27364a"/>
  <text x="255" y="326" text-anchor="middle" font-size="12" fill="#dbe4ee">did <tspan font-family="Consolas,monospace" fill="#8fa3b6">~/.ani/patterns/</tspan></text>
  <text x="255" y="346" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e7eef6">gain an F-*.md file?</text>

  <!-- yes branch -->
  <line x1="404" y1="331" x2="514" y2="331" stroke="#2fd6c3" stroke-width="1.6" marker-end="url(#t)"/>
  <text x="458" y="322" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2fd6c3">yes</text>
  <g>
    <rect x="520" y="293" width="330" height="76" rx="10" fill="#151f2b" stroke="#2fd6c3" stroke-opacity="0.55"/>
    <circle cx="546" cy="331" r="13" fill="none" stroke="#2fd6c3" stroke-width="1.5"/>
    <text x="546" y="335.5" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#2fd6c3">3</text>
    <text x="572" y="326" font-size="13.5" font-weight="600" fill="#e7eef6">heartbeat in your next session</text>
    <text x="572" y="348" font-size="11" fill="#94a5b8"><tspan font-family="Consolas,monospace" fill="#7fd8cc">[ani-index v1]</tspan> — install verified &#10003;</text>
  </g>

  <!-- no branch -->
  <line x1="255" y1="390" x2="255" y2="412" stroke="#44566b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="276" y="406" font-size="11" fill="#94a5b8">no</text>
  <g>
    <rect x="90" y="414" width="330" height="52" rx="10" fill="#151f2b" stroke="#27364a"/>
    <text x="106" y="436" font-size="12.5" font-weight="600" fill="#e7eef6">type <tspan font-family="Consolas,monospace" fill="#7fd8cc">/ani</tspan> to capture manually</text>
    <text x="106" y="455" font-size="10.5" fill="#94a5b8">the protocol is complete without hooks — file an issue, we fix the hook</text>
  </g>
</svg>
