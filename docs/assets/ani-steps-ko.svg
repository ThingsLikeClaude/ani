<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" role="img" aria-label="교정 한 번이 겪는 5단계: RESTATE, SEARCH, FIX, CAPTURE, TRIAGE와 컴파일 분기" font-family="'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#44566b"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2fd6c3"/></marker>
  </defs>
  <rect x="1.5" y="1.5" width="877" height="607" rx="14" fill="#0e1520" stroke="#1e2a38" stroke-width="1.5"/>
  <text x="28" y="42" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" letter-spacing="3" fill="#48626f">ANI &#183; THE FIVE-STEP LOOP</text>
  <text x="852" y="42" text-anchor="end" font-size="11" fill="#5d7284">교정 한 번이 겪는 일</text>

  <!-- entry pill -->
  <rect x="40" y="58" width="460" height="30" rx="15" fill="#151f2b" stroke="#27364a"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#b7c5d4">교정 감지 — &#8220;내 말을 잘못 알아들었다&#8221;는 의미, 언어 불문</text>
  <line x1="270" y1="88" x2="270" y2="100" stroke="#44566b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- step cards -->
  <g>
    <rect x="40" y="104" width="460" height="76" rx="10" fill="#151f2b" stroke="#27364a"/>
    <circle cx="68" cy="142" r="13" fill="none" stroke="#2fd6c3" stroke-width="1.5"/>
    <text x="68" y="146.5" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#2fd6c3">1</text>
    <text x="94" y="136" font-family="Consolas,monospace" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#2fd6c3">RESTATE</text>
    <text x="94" y="160" font-size="12" fill="#d7e0ea">진짜 의도를 한 줄로 되짚는다 — 확인 질문은 많아야 하나</text>
  </g>
  <line x1="270" y1="180" x2="270" y2="200" stroke="#44566b" stroke-width="1.6" marker-end="url(#a)"/>

  <g>
    <rect x="40" y="204" width="460" height="76" rx="10" fill="#151f2b" stroke="#27364a"/>
    <circle cx="68" cy="242" r="13" fill="none" stroke="#2fd6c3" stroke-width="1.5"/>
    <text x="68" y="246.5" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#2fd6c3">2</text>
    <text x="94" y="236" font-family="Consolas,monospace" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#2fd6c3">SEARCH</text>
    <text x="94" y="260" font-size="12" fill="#d7e0ea">두 INDEX를 훑고 후보 S만 연다 — 재교정된 S는 강등</text>
  </g>
  <line x1="270" y1="280" x2="270" y2="300" stroke="#44566b" stroke-width="1.6" marker-end="url(#a)"/>

  <g>
    <rect x="40" y="304" width="460" height="76" rx="10" fill="#151f2b" stroke="#27364a"/>
    <circle cx="68" cy="342" r="13" fill="none" stroke="#2fd6c3" stroke-width="1.5"/>
    <text x="68" y="346.5" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#2fd6c3">3</text>
    <text x="94" y="336" font-family="Consolas,monospace" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#2fd6c3">FIX</text>
    <text x="94" y="360" font-size="12" fill="#d7e0ea">교정을 실행한다 — 기록이 일을 막는 일은 없다</text>
  </g>
  <line x1="270" y1="380" x2="270" y2="400" stroke="#44566b" stroke-width="1.6" marker-end="url(#a)"/>

  <g>
    <rect x="40" y="404" width="460" height="76" rx="10" fill="#151f2b" stroke="#27364a"/>
    <circle cx="68" cy="442" r="13" fill="none" stroke="#2fd6c3" stroke-width="1.5"/>
    <text x="68" y="446.5" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#2fd6c3">4</text>
    <text x="94" y="436" font-family="Consolas,monospace" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#2fd6c3">CAPTURE</text>
    <text x="94" y="460" font-size="12" fill="#d7e0ea">F 파일 기록 + INDEX 갱신 — 실패가 세션 밖에 남는다</text>
  </g>
  <line x1="270" y1="480" x2="270" y2="500" stroke="#44566b" stroke-width="1.6" marker-end="url(#a)"/>

  <g>
    <rect x="40" y="504" width="460" height="76" rx="10" fill="#151f2b" stroke="#27364a"/>
    <circle cx="68" cy="542" r="13" fill="none" stroke="#2fd6c3" stroke-width="1.5"/>
    <text x="68" y="546.5" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#2fd6c3">5</text>
    <text x="94" y="536" font-family="Consolas,monospace" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#2fd6c3">TRIAGE</text>
    <text x="94" y="560" font-size="12" fill="#d7e0ea">계속 &#183; 되감기 &#183; 새 세션을 권한다 — 권고일 뿐이다</text>
  </g>

  <!-- compile fork -->
  <path d="M 500 442 C 526 442, 526 415, 554 415" fill="none" stroke="#44566b" stroke-width="1.6" marker-end="url(#t)"/>
  <path d="M 500 442 C 526 442, 526 505, 554 505" fill="none" stroke="#44566b" stroke-width="1.6" marker-end="url(#t)"/>
  <text x="527" y="462" text-anchor="middle" font-size="10.5" fill="#6b7f92">컴파일</text>

  <g>
    <rect x="560" y="380" width="290" height="70" rx="10" fill="#151f2b" stroke="#27364a"/>
    <rect x="576" y="394" width="40" height="18" rx="9" fill="#2b2415" stroke="#eab54e"/>
    <text x="596" y="407" text-anchor="middle" font-size="10" font-weight="600" fill="#eab54e">자동</text>
    <text x="626" y="408" font-family="Consolas,monospace" font-size="13" font-weight="700" fill="#eab54e">S provisional</text>
    <text x="576" y="434" font-size="11" fill="#94a5b8">증거 E &#8805; 5 — 즉시 사용, 잠정임을 밝힌다</text>
  </g>
  <g>
    <rect x="560" y="470" width="290" height="70" rx="10" fill="#151f2b" stroke="#27364a"/>
    <rect x="576" y="484" width="40" height="18" rx="9" fill="#0f2924" stroke="#2fd6c3"/>
    <text x="596" y="497" text-anchor="middle" font-size="10" font-weight="600" fill="#2fd6c3">수동</text>
    <text x="626" y="498" font-family="Consolas,monospace" font-size="13" font-weight="700" fill="#2fd6c3">S active</text>
    <text x="576" y="524" font-size="11" fill="#94a5b8"><tspan font-family="Consolas,monospace" fill="#7fd8cc">/ani ok</tspan> 승인 — 가장 먼저 적용된다</text>
  </g>
</svg>
